<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="FiveStar">
  <defs>
    <path id="fs-star" d="M0,-1 L0.2245,-0.309 L0.951,-0.309 L0.3633,0.1181 L0.588,0.809 L0,0.382 L-0.588,0.809 L-0.3633,0.1181 L-0.951,-0.309 L-0.2245,-0.309 Z"/>
  </defs>

  <!-- badge -->
  <circle cx="256" cy="256" r="247" fill="#000000" stroke="#C9A227" stroke-width="10"/>

  <!-- five stars, arcing up to the centre -->
  <g fill="#C9A227">
    <use href="#fs-star" transform="translate(80,172) scale(30)"/>
    <use href="#fs-star" transform="translate(164,126) scale(40)"/>
    <use href="#fs-star" transform="translate(256,100) scale(52)"/>
    <use href="#fs-star" transform="translate(348,126) scale(40)"/>
    <use href="#fs-star" transform="translate(432,172) scale(30)"/>
  </g>

  <!-- shield -->
  <path d="M130,222 L256,186 L382,222 C382,308 368,398 256,476 C144,398 130,308 130,222 Z"
        fill="none" stroke="#C9A227" stroke-width="24" stroke-linejoin="round"/>

  <!-- bar chart inside the shield -->
  <g fill="#C9A227">
    <rect x="186" y="392" width="20" height="52"/>
    <rect x="216" y="368" width="20" height="76"/>
    <rect x="246" y="336" width="20" height="108"/>
    <rect x="276" y="360" width="20" height="84"/>
    <rect x="306" y="330" width="20" height="114"/>
  </g>

  <!-- rising trend line, breaking out through the shield -->
  <path d="M104,406 L186,326 L232,362 L344,242" fill="none" stroke="#C9A227"
        stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M410,180 L397,279 L313,203 Z" fill="#C9A227"/>
</svg>
